name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Подключить MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Запустить тесты net8.0
        run: dotnet run --project tests\EsmTspiot.Shared.Tests\EsmTspiot.Shared.Tests.csproj -c Release

      - name: Запустить тесты net48 системным компилятором
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $files = Get-ChildItem -Recurse "src\EsmTspiot.Shared" -Filter *.cs |
            Where-Object { $_.FullName -notmatch '\\obj\\|\\bin\\' } |
            ForEach-Object { $_.FullName }
          $files += (Resolve-Path "tests\EsmTspiot.Shared.Tests\Program.cs").Path
          & $csc /nologo /define:NETFRAMEWORK /out:"$env:TEMP\SharedTests.exe" /r:System.Net.Http.dll /r:System.Web.Extensions.dll /r:System.Runtime.Serialization.dll $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:TEMP\SharedTests.exe"
          exit $LASTEXITCODE

      - name: Проверить операторский адаптер АТОЛ
        shell: powershell
        run: |
          dotnet run --project tests\EsmTspiot.Operator.Tests\EsmTspiot.Operator.Tests.csproj -f net8.0-windows -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests\EsmTspiot.Operator.Tests\EsmTspiot.Operator.Tests.csproj -f net48 -c Release
          exit $LASTEXITCODE

      - name: Собрать и запустить тесты provisioner
        shell: powershell
        run: |
          msbuild tests\EsmTspiot.ServiceProvisioner.Tests\EsmTspiot.ServiceProvisioner.Tests.csproj /restore /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "tests\EsmTspiot.ServiceProvisioner.Tests\bin\Release\net48\EsmTspiot.ServiceProvisioner.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild src\EsmTspiot.ServiceProvisioner\EsmTspiot.ServiceProvisioner.csproj /restore /p:Configuration=Release /p:LangVersion=5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Проверить безопасность LM-реализации
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify_lm_safety.ps1

      - name: Собрать Legacy и helper строго с C# 5
        run: msbuild src\EsmTspiot.Legacy.WinForms\EsmTspiot.Legacy.WinForms.csproj /restore /p:Configuration=Release /p:LangVersion=5

      - name: Проверить операторский интерфейс
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify_ui_layout.ps1

      - name: Собрать Modern
        run: dotnet build src\EsmTspiot.Modern.WinForms\EsmTspiot.Modern.WinForms.csproj -c Release

      - name: Собрать и проверить компактный ZIP
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package_compact_release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "artifacts\release\MultiKKT-ESM-TSPioT-compact.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName | Sort-Object)
            $entries | ForEach-Object { Write-Host $_ }
            if ($entries -match '(?i)(modern|win-x64|win-x86|esm-lm-controller|lmcontroller|\.pdb$)') {
              throw "Compact ZIP contains a forbidden release entry."
            }
          }
          finally {
            $archive.Dispose()
          }
